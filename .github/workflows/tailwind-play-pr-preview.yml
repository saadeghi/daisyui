name: "🎨 Tailwind Play PR preview"

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - "packages/daisyui/src/components/*.css"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: "Create before/after links"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target has a write-capable token. Keep the checkout pinned to
      # trusted base-branch code and read PR files only through git object data.
      - name: Checkout trusted base revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch PR revision as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Create Tailwind Play comparisons
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_OUTPUT: ${{ runner.temp }}/tailwind-play-preview.json
        run: |
          bun packages/tailwind-play-share/pr-preview.mjs \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --output "$PREVIEW_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v8
        env:
          PREVIEW_OUTPUT: ${{ runner.temp }}/tailwind-play-preview.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs")
            const preview = JSON.parse(fs.readFileSync(process.env.PREVIEW_OUTPUT, "utf8"))
            const components = preview.components.map((name) => `\`${name}\``).join(", ")
            const body = [
              "## Tailwind Play comparison",
              "",
              `Commit: \`${preview.headSha.slice(0, 7)}\``,
              `Changed components: ${components}`,
              "",
              `- [Before changes](${preview.beforeUrl})`,
              `- [After changes](${preview.afterUrl})`,
            ].join("\n")

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
