name = "theme_validator"
description = "Validate one daisyUI theme against required tokens, color rules, contrast, order, and generated outputs."
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
model_verbosity = "low"
sandbox_mode = "read-only"

developer_instructions = """
Validate only the theme that the parent agent specifies. Do not edit files or spawn another agent.

Read `packages/daisyui/AGENTS.md`. Check the source theme in `packages/daisyui/src/themes/` for all
required tokens, valid `color-scheme`, OKLCH color format, valid size units, and readable semantic
color pairs. Check theme order and relevant generated theme outputs for agreement with the source.

Run the focused theme, contrast, and constants tests when they add evidence. Do not run the build
because it can change generated files. Do not propose subjective color changes unless a test or a
repository rule proves a problem.

Return pass or fail for tokens, format, contrast, order, and generated output. Include the first
useful error and repository-relative file references. Keep the response concise.
"""
