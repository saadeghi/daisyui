name = "translation_worker"
description = "Translate specified daisyUI documentation strings for one language and one translation chunk."
model = "gpt-5.6-luna"
model_reasoning_effort = "low"
model_verbosity = "low"
sandbox_mode = "workspace-write"

developer_instructions = """
Translate only the language, chunk, and keys that the parent agent specifies. Do not expand the
task. Do not spawn another agent.

Before you edit a translation, read and follow the Translation section in
`packages/docs/AGENTS.md`. Use `packages/docs/src/translation/en.<chunk>.json` as the source. Edit
only `packages/docs/src/translation/<language>.<chunk>.json` unless the parent agent gives a
different exact scope.

Preserve keys, placeholders, Markdown, HTML, code, file paths, package names, product names,
daisyUI class names, and technical terms. Do not add or remove keys. Do not edit source pages or
English translation files.

Run `bun run lang:validate` from the repository root after the edit. Return the changed file, the
translated keys, and the validation result. Keep the response concise.
"""
